<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs</title>
    <link href="style/bootstrap.min.css" rel="stylesheet"/>
    <link href="style/font-awesome/css/font-awesome.min.css" rel="stylesheet"/>
    <script src="style/bootstrap.bundle.js" defer></script>
    <script src="jobs.js" type="module" defer></script>
    <script src="jobsPopulater.js" type="module" defer></script>
    <script src="./reusable_components/navbarLoader.js" defer></script>
    <style>
        .hoverEffect:hover {
            transform: scale(1.05, 1.05);
            cursor:pointer;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            transition-duration: 0.4s;
        }

        .loader {
            width: 50px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 8px solid lightblue;
            border-right-color: orange;
            animation: l2 1s infinite linear;
        }
        @keyframes l2 {to{transform: rotate(1turn)}}
    </style>
</head>
<body>
    <!--This is will be the nav bar along with the Title Tigray jobs-->
    
    <div class="shadow-lg p-5 px-0" style="background: linear-gradient(to right, rgba(178, 245, 206, 0.7), rgba(191, 203, 255, 0.7)), url(images/back.jpg); position: relative;">
        
        <div class="container mt-5 mb-0" style="width: 70%;">
            <span class="bg-white text-black p-3 px-5 rounded-3">
                Search
            </span>
            
        </div>
        <div class="container bg-white rounded-2 mt-0 mb-3 p-3 px-5 shadow-lg" style="width: 75%;">
                <div class="row">
                    <input id="searchedValue" required class="form-control col-lg mx-2 mb-1" placeholder="Input here"/>
                    <div class="col-lg m-2 input-group m-auto">
                        <label class="input-group-text p-3">Search By:</label>
                        <select id="searchBy" class="form-select p-3">
                            <option value="jobName" selected>By Name</option>
                            <option value="cityName">By Location</option>
                            <option value="company">By Company</option>
                            <option value="category">By Category</option>
                        </select>
                    </div> 
                    <input id="searchingButton" type="button" class="col-lg btn btn-primary mx-2 py-3 my-1" value="Search">
                </div>
        </div>
        
        <div id="displayContent" class="container  p-5 rounded-5" style="background-color: rgba(255, 255, 255, 0.85);">
            <h1 id="jobsTitle">All Jobs</h1>
            <button style = "display: none;" id="returnToAll" class="btn btn-primary" type="button">Return To All Jobs</button>
            <div style="display: none;" id = "newJobsUploaded">
                <h4>There are new Jobs uploaded.</h4>
                <button id="showNewJobs" class="btn btn-primary" type="button">Show New Jobs</button>
            </div>
            
            <div id="jobsHolder">
                <div class="loader"></div>
            </div>         
        </div>

     </div>




     <!--This is for the all the links of the webpage-->
     <div class="container m-auto my-5">
        <div class="row">
            <div class="col-lg-4">
                <h1>Contact Us</h1>
                <div><i class="fa fa-map-marker fa-2x"></i><p class="d-inline-block fw-bolder">Ethiopia, Mekelle - Mekelle University</p></div>
                <div><i class="fa fa-phone fa-lg"></i><p class="d-inline-block fw-bolder">+251933250034</p></div>
                <div><i class="fa fa-envelope fa-lg"></i><p class="d-inline-block fw-bolder">TJ123@gmail.com</p></div>
            </div>
            <div class="col-lg-4 lead">
                <h1>Mission</h1>
                <p>Our mission is to help job seekers find their dream job and help Employers find the best candidates.</p>
            </div> 
        </div>
    </div>



    <!--For the newsletter-->
    <div class="p-3 mb-0" style="background: linear-gradient(to right, rgba(178, 245, 206, 0.7), rgba(191, 203, 255, 0.7)), url(images/back.jpg);">
        <div class="m-2 input-group my-4 w-75 m-auto">
            <label class="input-group-text" style="border: solid rgba(80, 80, 80, 0.5) 1px; border-radius: 6px;">Subscribe to our newsletter</label>
            <input class="form-control w-50" style="border: solid rgba(80, 80, 80, 0.5) 1px; border-radius: 6px;" type="email"/>
            <input type="button" class="btn btn-primary" value="subscribe"/>
        </div> 

        <div class="row">
            <div class="col-md-12 text-center">
                <p>
                    Tigray Jobs, Copyright &copy; 2014 all rights reserved.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
