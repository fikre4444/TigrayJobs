<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tigary Jobs</title>
    <link href="style/bootstrap.min.css" rel="stylesheet"/>
    <link href="style/font-awesome/css/font-awesome.min.css" rel="stylesheet"/>
    <script src="style/bootstrap.bundle.js" defer></script>
    <link href="style/style.css" rel="stylesheet"/>
    <script src="./reusable_components/navbarLoader.js" defer></script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Logging In...</p>
    </div>

    <div class="shadow-lg p-5" style="background: linear-gradient(to right, rgba(178, 245, 206, 0.7), rgba(191, 203, 255, 0.7)), url(images/back.jpg);">
        <!--For Logging in-->
        <div class="container shadow-lg p-5 rounded-5 w-50" style="background-color: rgba(255, 255, 255, 0.85);">
            <form id="loginForm">
                <div class="row">
                    <fieldset class="col-md">
                        <div class="mb-3">
                            <div class="display-6">Login(Employer)</div>
                            <div class="input-group m-2" style="border: solid rgba(80, 80, 80, 0.5) 1px; border-radius: 6px;">
                                <label class="input-group-text">Email Address:</label>
                                <input id="email" class="form-control" type="email" required placeholder="input your email here">
                            </div>
                            <div class="input-group m-2" style="border: solid rgba(80, 80, 80, 0.5) 1px; border-radius: 6px;">
                                <label class="input-group-text">Password</label>
                                <input id="password" class="form-control" type="password" required placeholder="input your password here">
                            </div>
                        </div>
                    </fieldset>
                </div>
                <input id="registrationSubmit" type="submit" class="btn btn-primary p-3 px-5 h2" value="Login"/>
            </form>
            

        </div>
    </div>

     <!--This is for the all the links of the webpage-->
     <div class="container m-auto my-5">
        <div class="row">
            <div class="col-lg-4">
                <h1>Contact Us</h1>
                <div><i class="fa fa-map-marker fa-2x"></i><p class="d-inline-block fw-bolder">Ethiopia, Mekelle - Mekelle University</p></div>
                <div><i class="fa fa-phone fa-lg"></i><p class="d-inline-block fw-bolder">+251933250034</p></div>
                <div><i class="fa fa-envelope fa-lg"></i><p class="d-inline-block fw-bolder">TJ123@gmail.com</p></div>
            </div>
            <div class="col-lg-4 lead">
                <h1>Mission</h1>
                <p>Our mission is to help job seekers find their dream job and help Employers find the best candidates.</p>
            </div> 
        </div>
    </div>

    <!--For the newsletter-->
    <div class="p-3 mb-0" style="background: linear-gradient(to right, rgba(178, 245, 206, 0.7), rgba(191, 203, 255, 0.7)), url(images/back.jpg);">
        <div class="m-2 input-group my-4 w-75 m-auto">
            <label class="input-group-text" style="border: solid rgba(80, 80, 80, 0.5) 1px; border-radius: 6px;">Subscribe to our newsletter</label>
            <input class="form-control w-50" style="border: solid rgba(80, 80, 80, 0.5) 1px; border-radius: 6px;" type="email"/>
            <input type="button" class="btn btn-primary" value="subscribe"/>
        </div> 

        <div class="row">
            <div class="col-md-12 text-center">
                <p>
                    Tigray Jobs, Copyright &copy; 2014 all rights reserved.
                </p>
            </div>
        </div>
    </div>

    <script src="loginEmployer.js" type="module"></script>
</body>
</html>
